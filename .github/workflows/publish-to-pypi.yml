name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:  # builds and checks the distributions without uploading

jobs:
  build-and-publish:
    name: Build and publish Python distribution to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/scfocus-sc/
    permissions:
      id-token: write  # PyPI trusted publishing
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Verify version matches tag
        if: github.event_name == 'release'
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          SETUP_VERSION=$(sed -n "s/^ *version *= *['\"]\([^'\"]*\)['\"].*/\1/p" setup.py | head -1)
          INIT_VERSION=$(sed -n "s/^__version__ *= *['\"]\([^'\"]*\)['\"].*/\1/p" scfocus/__init__.py | head -1)
          echo "tag $TAG_VERSION, setup.py $SETUP_VERSION, scfocus/__init__.py $INIT_VERSION"
          if [ "$TAG_VERSION" != "$SETUP_VERSION" ] || [ "$TAG_VERSION" != "$INIT_VERSION" ]; then
            echo "Error: the tag, setup.py and scfocus/__init__.py versions must match"
            exit 1
          fi

      - name: Build package
        run: python -m build

      - name: Check distribution
        run: twine check dist/*

      - name: Publish to PyPI
        if: github.event_name == 'release'
        uses: pypa/gh-action-pypi-publish@release/v1
